apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aks-operations
  namespace: aks-operations
spec:
  gatewayClassName: approuting-istio
  listeners:
    - name: https
      hostname: aks.example.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: aks-operations-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aks-operations
  namespace: aks-operations
spec:
  parentRefs:
    - name: aks-operations
      sectionName: https
  hostnames:
    - aks.example.com
  rules:
    - backendRefs:
        - name: aks-operations
          port: 80
