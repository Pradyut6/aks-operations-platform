apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: aks-operations

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aks-operations

  minReplicas: 2
  maxReplicas: 6

  metrics:
  - type: Resource

    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: 70