#cloud-config

package_update: true
package_upgrade: true

packages:
  - docker.io
  - unzip
  - curl
  - jq
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - git

write_files:
  - path: /usr/local/bin/register-ado-agent.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail

      AZDO_ORG_URL="${ado_org_url}"
      AZDO_POOL="AKS-Operations-Agents"
      AZDO_AGENT_NAME="prod-ado-agent"

      KEYVAULT_NAME="${bootstrap_vault_name}"
      PAT_SECRET_NAME="ado-agent-pat"

      AGENT_DIR="/home/azureuser/azagent"
      AGENT_USER="azureuser"

      MARKER_FILE="/var/lib/azure-devops-agent-registered"
      AGENT_VERSION="${AGENT_VERSION}"

      AGENT_PACKAGE="${AGENT_PACKAGE}"
      AGENT_URL="https://download.agent.dev.azure.com/agent/$AGENT_VERSION/$AGENT_PACKAGE"

      echo "============================================"
      echo " Azure DevOps Agent Bootstrap"
      echo "============================================"

      if [ -f "$MARKER_FILE" ]; then
          echo "Azure DevOps agent is already registered."
          exit 0
      fi

      mkdir -p "$AGENT_DIR"
      chown -R "$AGENT_USER:$AGENT_USER" "$AGENT_DIR"

      cd "$AGENT_DIR"

      echo "Downloading Azure DevOps Agent $AGENT_VERSION..."

      curl -fsSL "$AGENT_URL" -o "$AGENT_PACKAGE"

      tar -xzf "$AGENT_PACKAGE"
      rm -f "$AGENT_PACKAGE"

      chown -R "$AGENT_USER:$AGENT_USER" "$AGENT_DIR"

      echo "Authenticating Azure using Managed Identity..."

      az login --identity --allow-no-subscriptions >/dev/null

      echo "Retrieving Azure DevOps PAT from Key Vault..."

      AZDO_PAT=""
      for attempt in $(seq 1 12); do
          if AZDO_PAT="$(az keyvault secret show \
              --vault-name "$KEYVAULT_NAME" \
              --name "$PAT_SECRET_NAME" \
              --query value --output tsv --only-show-errors)" && [ -n "$AZDO_PAT" ]; then
              break
          fi
          sleep 15
      done

      if [ -z "$AZDO_PAT" ]; then
          echo "ERROR: Azure DevOps PAT could not be retrieved."
          exit 1
      fi

      echo "Registering Azure DevOps agent..."

      sudo -u "$AGENT_USER" env AZDO_PAT="$AZDO_PAT" bash -c "
          cd '$AGENT_DIR'

          ./config.sh \
              --unattended \
              --url '$AZDO_ORG_URL' \
              --auth pat \
              --token \"\$AZDO_PAT\" \
              --pool '$AZDO_POOL' \
              --agent '$AZDO_AGENT_NAME' \
              --work '_work' \
              --replace
      "

      unset AZDO_PAT

      echo "Installing agent as system service..."

      cd "$AGENT_DIR"

      ./svc.sh install "$AGENT_USER"
      ./svc.sh start

      touch "$MARKER_FILE"

      echo "============================================"
      echo " Azure DevOps Agent setup completed"
      echo "============================================"

runcmd:
  - systemctl enable docker
  - systemctl start docker

  - usermod -aG docker azureuser

  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash

  - az aks install-cli --client-version v1.36.0

  - mkdir -p /home/azureuser/azagent
  - chown -R azureuser:azureuser /home/azureuser/azagent

  - /usr/local/bin/register-ado-agent.sh