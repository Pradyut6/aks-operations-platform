name: Validate AKS platform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform/environments/prod init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform/environments/prod validate

  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r application/requirements.txt
      - run: python -m unittest discover -s application -v
      - run: docker build --tag aks-operations:validation application
